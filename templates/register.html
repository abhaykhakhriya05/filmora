<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVibe - Create Account</title>
    <!-- Font Awesome for Icons and Password Eye Toggle -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- Core Design System Foundations --- */
        :root {
            --bg-black: #0f0f0f;
            --card-bg: #1a1a1a;
            --input-bg: #141414;
            --border-color: #262626;
            --text-white: #ffffff;
            --text-gray: #999999;
            --text-light-gray: #bfbfbf;
            --primary-red: #e50914;
            --primary-red-hover: #ff0f1c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* --- Auth Page Centered View Wrapper --- */
        .auth-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }

        .auth-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 540px; /* Slightly wider display context to hold grids side-by-side */
            border-radius: 16px;
            padding: clamp(24px, 5vw, 45px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .auth-header p {
            color: var(--text-gray);
            font-size: 0.9rem;
        }

        /* --- Fluid Grid Grid Field Row --- */
        .form-grid-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.88rem;
            color: var(--text-light-gray);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .input-control {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-white);
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .input-with-toggle {
            padding-right: 46px;
        }

        .input-control:focus {
            border-color: rgba(229, 9, 20, 0.5);
            box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.15);
        }

        /* --- Password Show/Hide Toggle --- */
        .password-toggle-btn {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-gray);
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: color 0.2s ease;
        }

        .password-toggle-btn:hover {
            color: var(--text-white);
        }

        .terms-condition {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            cursor: pointer;
            color: var(--text-gray);
            font-size: 0.85rem;
            margin: 10px 0 25px 0;
            line-height: 1.4;
        }

        .terms-condition input {
            accent-color: var(--primary-red);
            width: 16px;
            height: 16px;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .terms-condition a {
            color: var(--text-white);
            text-decoration: none;
            font-weight: 500;
        }

        .terms-condition a:hover {
            color: var(--primary-red);
            text-decoration: underline;
        }

        .btn-auth-submit {
            width: 100%;
            background-color: var(--primary-red);
            color: var(--text-white);
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .btn-auth-submit:hover {
            background-color: var(--primary-red-hover);
            transform: translateY(-1px);
        }

        .auth-divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
            color: var(--text-gray);
            font-size: 0.85rem;
        }

        .auth-divider::before, .auth-divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background-color: var(--border-color);
        }

        .auth-divider::before { left: 0; }
        .auth-divider::after { right: 0; }

        .social-auth-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 30px;
        }

        .btn-social-auth {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-white);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background-color 0.2s ease;
        }

        .btn-social-auth:hover { background-color: #1e1e1e; }

        .switch-auth-mode {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-gray);
        }

        .switch-auth-mode a {
            color: var(--text-white);
            font-weight: 600;
            text-decoration: none;
            margin-left: 4px;
        }

        .switch-auth-mode a:hover {
            color: var(--primary-red);
            text-decoration: underline;
        }

        /* --- Footer Setup --- */
        footer {
            border-top: 1px solid var(--border-color);
            background-color: #0a0a0a;
            padding: 30px 0;
            margin-top: auto;
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-gray);
            flex-wrap: wrap;
            gap: 15px;
        }

        /* --- Handheld Screen Collapsing Configurations --- */
        @media (max-width: 768px) {
            .form-grid-row { grid-template-columns: 1fr; gap: 0; } /* Collapse name grids vertically on mobile screens */
            .footer-bottom {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- Main Dynamic Centered Frame Container Matrix -->
    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Create an Account</h1>
                <p>Start your 7-day free trial subscription today.</p>
            </div>

            <form id="registerForm" onsubmit="event.preventDefault();">
                <div class="form-grid-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <div class="input-wrapper">
                            <input type="text" id="firstName" class="input-control" placeholder="John" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <div class="input-wrapper">
                            <input type="text" id="lastName" class="input-control" placeholder="Doe" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="regEmail" class="input-control" placeholder="you@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="regPassword" class="input-control input-with-toggle" placeholder="Minimum 8 characters" minlength="8" required>
                        <button type="button" class="password-toggle-btn" id="passwordToggle" aria-label="Toggle password visibility">
                            <i class="fa-regular fa-eye-slash"></i>
                        </button>
                    </div>
                </div>

                <label class="terms-condition">
                    <input type="checkbox" required>
                    <span>I agree to the <a href="#">Terms of Use</a> and acknowledge that I have read the <a href="#">Privacy Policy</a>.</span>
                </label>

                <button type="submit" class="btn-auth-submit">Create Account</button>
            </form>

            <div class="auth-divider">OR</div>

            <div class="social-auth-grid">
                <button class="btn-social-auth"><i class="fa-brands fa-google"></i> Google</button>
                <button class="btn-social-auth"><i class="fa-brands fa-apple"></i> Apple</button>
            </div>

            <div class="switch-auth-mode">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 streamvibe. All Rights Reserved</p>
            </div>
        </div>
    </footer>

    <script>
        // Password Visibility Show/Hide Architecture
        const passwordInput = document.getElementById('regPassword');
        const passwordToggle = document.getElementById('passwordToggle');

        if (passwordInput && passwordToggle) {
            passwordToggle.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                const icon = passwordToggle.querySelector('i');
                if (type === 'text') {
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                } else {
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                }
            });
        }
    </script>
</body>
</html>
