<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVibe - Create Account</title>
    <!-- Font Awesome for Icons and Password Eye Toggle -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Main Dynamic Centered Frame Container Matrix -->
    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Create an Account</h1>
                <p>Start your 7-day free trial subscription today.</p>
            </div>

            <form id="registerForm" method="post" action="{{ url_for('auth.register') }}">
                <div class="form-grid-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <div class="input-wrapper">
                            <input type="text" name="firstName" id="firstName" class="input-control" placeholder="John" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <div class="input-wrapper">
                            <input type="text" name="lastName" id="lastName" class="input-control" placeholder="Doe" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" name="email" id="regEmail" class="input-control" placeholder="you@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <div class="input-wrapper">
                        <input type="password" name="password" id="regPassword" class="input-control input-with-toggle" placeholder="Minimum 8 characters" minlength="8" required>
                        <button type="button" class="password-toggle-btn" id="passwordToggle" aria-label="Toggle password visibility">
                            <i class="fa-regular fa-eye-slash"></i>
                        </button>
                    </div>
                </div>

                <label class="terms-condition">
                    <input type="checkbox" required>
                    <span>I agree to the <a href="#">Terms of Use</a> and acknowledge that I have read the <a href="#">Privacy Policy</a>.</span>
                </label>

                <button type="submit" class="btn-auth-submit">Create Account</button>
            </form>

            <div class="auth-divider">OR</div>

            <div class="social-auth-grid">
                <button class="btn-social-auth"><i class="fa-brands fa-google"></i> Google</button>
                <button class="btn-social-auth"><i class="fa-brands fa-apple"></i> Apple</button>
            </div>

            <div class="switch-auth-mode">
                Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 streamvibe. All Rights Reserved</p>
            </div>
        </div>
    </footer>

    <script>
        // Password Visibility Show/Hide Architecture
        const passwordInput = document.getElementById('regPassword');
        const passwordToggle = document.getElementById('passwordToggle');

        if (passwordInput && passwordToggle) {
            passwordToggle.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                const icon = passwordToggle.querySelector('i');
                if (type === 'text') {
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                } else {
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                }
            });
        }
    </script>
</body>
</html>
